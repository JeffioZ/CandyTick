version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      androidx-and-agp:
        patterns:
          - "androidx.*"
          - "com.android.*"
      kotlin-and-kotlinx:
        patterns:
          - "org.jetbrains.kotlin*"
      third-party:
        patterns:
          - "com.squareup.okhttp3:*"
          - "top.yukonga.miuix.kmp:*"
          - "org.commonmark:*"
          - "junit:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
