name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > candytick-release.keystore
          printf 'storeFile=candytick-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache

      - name: Check APK version against release tag
        run: |
          VERSION=$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # 提取该版本段落（## [X.Y.Z] 到下一个 ## 前），去掉段落标题行
          # index 匹配而非正则：规避 awk 对 \[ 转义的平台差异
          awk -v ver="$VERSION" '
            index($0, "## [") == 1 { p = (index($0, "## [" ver "]") == 1) }
            p
          ' CHANGELOG.md | tail -n +2 | sed -e '/./,$!d' > release_notes.md
          test -s release_notes.md
          echo "--- notes for $VERSION ---"
          cat release_notes.md

      - name: Clean up secrets
        if: always()
        run: |
          rm -f candytick-release.keystore keystore.properties

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/release/app-release.apk "candytick-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: candytick-*.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
