name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v header="## [${GITHUB_REF_NAME#v}]" '
            /^## \[/ {
              if (found) exit
              found = (index($0, header) == 1)
              next
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::No release notes found for $GITHUB_REF_NAME in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Accept Android SDK licenses
        run: |
          # sdkmanager closes stdin once it has all answers, which can send SIGPIPE to yes.
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}" "${STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}" "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          keystore="$RUNNER_TEMP/candytick-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: bash gradlew :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Clean up signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/candytick-release.keystore" keystore.properties

      - name: Verify and stage release APK
        run: |
          dir=app/build/outputs/apk/release
          output_file=$(jq -er --arg version "${GITHUB_REF_NAME#v}" '
            select(.applicationId == "io.candy.tick" and .variantName == "release") |
            .elements | select(length == 1) | .[0] |
            select(.versionName == $version and .type == "SINGLE" and .filters == []) |
            .outputFile | select(test("^[^/]+\\.apk$"))
          ' "$dir/output-metadata.json") || {
            echo "::error::Expected a single release APK matching tag $GITHUB_REF_NAME"
            exit 1
          }
          apk="$dir/$output_file"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "apksigner path: $apksigner"
          "$apksigner" --version || true
          "$apksigner" verify --print-certs "$apk" || echo "apksigner exit=$? (raw output above)"
          # Signing certificate of the publicly distributed v0.4.2 APK.
          release_cert=af65b854edac67a07735417a12d7d96d39fbf1d6f4ab0c1018529e209a6452fd
          # 逐行比较：新版 apksigner 对多签名方案可能把同一证书打印成多行 Signer 摘要，
          # 整串相等比较会被多余换行误杀（v0.5.0 首跑即此）。指纹本身公开，直接输出便于定论
          certs=$("$apksigner" verify --print-certs "$apk" |
            sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]+)$/\1/p')
          echo "signer digests: [${certs//$'\n'/, }]"
          if [[ -z "$certs" ]] || grep -qv "^$release_cert$" <<<"$certs"; then
            echo "::error::APK signing certificate does not match the published release"
            exit 1
          fi
          cp -- "$apk" "$RUNNER_TEMP/candytick-$GITHUB_REF_NAME.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ runner.temp }}/candytick-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
